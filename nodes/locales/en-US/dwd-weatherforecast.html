<script type="text/x-red" data-help-name="dwd-weatherforecast">
    <p>
        Retrieves the official DWD MOSMIX_L forecast for a single weather station
        and exposes it as a time series that can be used in dashboards, automations
        or further processing nodes.
    </p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>msg.payload
            <span class="property-type">any</span>
        </dt>
        <dd>
            The incoming payload is not interpreted by the node.
            Every incoming message simply acts as a trigger for a new fetch
            (on top of any configured auto-refresh).
        </dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>msg.payload
            <span class="property-type">Array&lt;Object&gt;</span>
        </dt>
        <dd>
            Array of forecast points ordered by time.
            Each entry contains the timestamp (<code>ts</code>, <code>iso</code>) and a
            <code>type</code> classification (<code>past</code>, <code>current</code>,
            <code>forecast</code>), the standard fields (temperature, dew point, wind,
            relative humidity, pressure, visibility, cloud cover, precipitation incl.
            <code>precipitationText</code>) and every configured additional MOSMIX field.
            Additional fields with an assigned conversion are converted according
            to the output options (temperature in °C, wind in km/h, pressure in
            hPa, visibility in km), all others stay unchanged; a field with no
            data at all in the time window is omitted from
            the records and reported in <code>msg.fields_not_found</code>,
            partially available fields keep <code>null</code> gaps.
        </dd>

        <dt>msg.station
            <span class="property-type">Object</span>
        </dt>
        <dd>
            The DWD station used for the request (<code>id</code> and resolved <code>name</code>).
        </dd>

        <dt>msg.used_fields
            <span class="property-type">Object</span>
        </dt>
        <dd>
            Dictionary of all actually delivered fields: field name to
            <code>{code, unit, de, en}</code> (MOSMIX code, unit, German/English description).
            When an output-option conversion was applied, <code>unit</code> holds the
            effective unit and <code>unit_original</code> the original MOSMIX unit.
        </dd>

        <dt>msg.fields_not_found
            <span class="property-type">Object</span>
        </dt>
        <dd>
            Requested additional fields with no data in the current time
            window, same structure as <code>msg.used_fields</code>. Such fields
            are omitted from the records entirely; fields with values only at
            some timestamps remain in the records with <code>null</code> gaps.
            The standard fields are a fixed part of the record schema: they
            stay in every record even without values (then <code>null</code>)
            and do not appear here.
        </dd>

        <dt>msg._meta
            <span class="property-type">Object</span>
        </dt>
        <dd>
            Meta information about the request (URL, record count, stale flag,
            available parameter codes, additional-fields diagnostics).
        </dd>
    </dl>

    <h3>Configuration</h3>
    <dl>
        <dt>DWD station ID</dt>
        <dd>
            Official DWD id of the station (for example <code>H721</code> for Cologne/Bonn).
            If left empty the node will fail with an error status.
        </dd>

        <dt>Source URL</dt>
        <dd>
            URL template used to download the MOSMIX_L KMZ file.
            By default the official DWD Open Data endpoint is used.
        </dd>

        <dt>Fetch on deploy</dt>
        <dd>
            Triggers an initial fetch immediately after deployment so that data
            is available without sending a manual inject first.
        </dd>

        <dt>Auto-refresh</dt>
        <dd>
            Optional interval (seconds) for periodic updates without a separate inject node.
        </dd>

        <dt>Lead time / Only future timestamps</dt>
        <dd>
            Limits the forecast horizon and filters out historic MOSMIX values.
        </dd>

        <dt>Output options</dt>
        <dd>
            Controls whether only a minimal core set of fields is returned or
            whether additional convenience fields are included (for example
            cardinal wind direction and converted units).
        </dd>

        <dt>Additional fields</dt>
        <dd>
            Extra MOSMIX elements (e.g. sunshine duration, gusts, thunderstorm
            probability) to include in every record, picked from the searchable
            catalogue. Fields with an assigned conversion are converted according
            to the output options, all others stay unchanged; a field with no
            data in the time window is omitted from the records and listed in
            <code>msg.fields_not_found</code>.
        </dd>
    </dl>

    <h3>Notes</h3>
    <ul>
        <li>Data is taken from the DWD MOSMIX_L forecast and is usually updated hourly.</li>
        <li>If stale mode is enabled the last successful forecast is kept in context and reused on errors.</li>
        <li>The wind direction mode option can add a human readable <code>windDirCardinal</code> field.</li>
    </ul>
</script>
