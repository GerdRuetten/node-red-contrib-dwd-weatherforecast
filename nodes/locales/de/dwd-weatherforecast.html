<script type="text/x-red" data-help-name="dwd-weatherforecast">
    <p>
        Ruft die offizielle DWD MOSMIX_L-Vorhersage für eine einzelne Messstation ab
        und stellt sie als Zeitreihe für weitere Flows (Dashboards, Auswertungen, Automationen) bereit.
    </p>

    <h3>Eingaben</h3>
    <dl class="message-properties">
        <dt>msg.payload
            <span class="property-type">beliebig</span>
        </dt>
        <dd>
            Der Inhalt der eingehenden Nachricht wird vom Node nicht ausgewertet.
            Jeder eingehende Trigger löst – sofern konfiguriert – einen neuen Abruf aus.
        </dd>
    </dl>

    <h3>Ausgaben</h3>
    <dl class="message-properties">
        <dt>msg.payload
            <span class="property-type">Array&lt;Object&gt;</span>
        </dt>
        <dd>
            Array von Vorhersagepunkten in zeitlicher Reihenfolge.
            Jeder Eintrag enthält den Zeitstempel (<code>ts</code>, <code>iso</code>) und eine
            <code>type</code>-Einordnung (<code>past</code>, <code>current</code>,
            <code>forecast</code>), die Standardfelder (Temperatur, Taupunkt, Wind,
            Luftfeuchte, Luftdruck, Sichtweite, Bewölkung, Niederschlag inkl.
            <code>precipitationText</code>) sowie jedes konfigurierte Zusatzfeld.
            Zusatzfelder mit zugeordneter Umrechnung werden gemäß den
            Ausgabeoptionen umgerechnet (Temperatur in °C, Wind in km/h,
            Druck in hPa, Sichtweite in km), alle anderen bleiben unverändert;
            ein Feld ohne einen einzigen Wert im Zeitfenster fehlt in den
            Datensätzen und wird in <code>msg.fields_not_found</code> gemeldet,
            Felder mit Teil-Lücken behalten <code>null</code>-Stellen.
        </dd>

        <dt>msg.station
            <span class="property-type">Object</span>
        </dt>
        <dd>
            Die verwendete DWD-Station (<code>id</code> und aufgelöster <code>name</code>).
        </dd>

        <dt>msg.used_fields
            <span class="property-type">Object</span>
        </dt>
        <dd>
            Dictionary aller tatsächlich gelieferten Felder: Feldname auf
            <code>{code, unit, de, en}</code> (MOSMIX-Code, Einheit, Beschreibung deutsch/englisch).
            Bei angewendeter Umrechnung enthält <code>unit</code> die effektive Einheit,
            <code>unit_original</code> die ursprüngliche MOSMIX-Einheit.
        </dd>

        <dt>msg.fields_not_found
            <span class="property-type">Object</span>
        </dt>
        <dd>
            Angeforderte Zusatzfelder, zu denen es im aktuellen Zeitfenster
            keine Daten gab – gleiche Struktur wie <code>msg.used_fields</code>.
            Diese Felder fehlen komplett in den Datensätzen; Felder mit Werten
            nur an einzelnen Zeitpunkten bleiben in den Datensätzen, dort mit
            <code>null</code>-Lücken. Die Standardfelder sind festes
            Record-Schema: Sie bleiben auch ohne Werte in jedem Datensatz
            (dann mit <code>null</code>) und erscheinen nicht hier.
        </dd>

        <dt>msg._meta
            <span class="property-type">Object</span>
        </dt>
        <dd>
            Metadaten zur Abfrage (URL, Datensatz-Anzahl, Stale-Flag,
            verfügbare Parametercodes, Diagnose zu Zusatzfeldern).
        </dd>
    </dl>

    <h3>Konfiguration</h3>
    <dl>
        <dt>DWD-Stations-ID</dt>
        <dd>
            Offizielle DWD-Kennung der Messstation (z.&nbsp;B. <code>H721</code> für Köln/Bonn).
            Wird dieses Feld leer gelassen, schlägt der Node mit einem Fehlerstatus fehl.
        </dd>

        <dt>Quell-URL</dt>
        <dd>
            URL-Template für die MOSMIX_L-KMZ-Datei.
            Standardmäßig wird die offizielle DWD-Open-Data-URL verwendet.
        </dd>

        <dt>Beim Deploy abrufen</dt>
        <dd>
            Löst direkt nach dem Deploy einen Abruf aus, damit sofort Daten zur Verfügung stehen.
        </dd>

        <dt>Auto-Refresh</dt>
        <dd>
            Optionales Intervall (Sekunden) für wiederkehrende Abrufe,
            ohne dass ein separater Inject-Node benötigt wird.
        </dd>

        <dt>Vorlauf / Nur zukünftige Zeitpunkte</dt>
        <dd>
            Beschränkt den Vorhersagezeitraum und filtert auf zukünftige Zeitstempel,
            um historische MOSMIX-Daten auszublenden.
        </dd>

        <dt>Ausgabeoptionen</dt>
        <dd>
            Steuern, ob nur Kernfelder (Minimal-Subset)
            oder zusätzliche Komfortfelder (z.&nbsp;B. Windrichtung als Himmelsrichtung,
            umgerechnete Einheiten) ausgegeben werden.
        </dd>

        <dt>Zusatzfelder</dt>
        <dd>
            Zusätzliche MOSMIX-Elemente (z.&nbsp;B. Sonnenscheindauer, Böen,
            Gewitterwahrscheinlichkeit), die in jeden Datensatz aufgenommen werden –
            auswählbar über die durchsuchbare Liste. Felder mit zugeordneter
            Umrechnung werden gemäß den Ausgabeoptionen umgerechnet, alle anderen
            bleiben unverändert; ein Feld ohne Werte im Zeitfenster fehlt in den
            Datensätzen und wird in <code>msg.fields_not_found</code> gelistet.
        </dd>
    </dl>

    <h3>Hinweise</h3>
    <ul>
        <li>Die Daten stammen aus der DWD MOSMIX_L-Vorhersage und werden typischerweise stündlich aktualisiert.</li>
        <li>Bei aktivierter Stale-Option bleibt bei Fehlern die letzte erfolgreiche Vorhersage im Kontext erhalten.</li>
        <li>Mit der Option „Windrichtungsmodus“ kann zusätzlich <code>windDirCardinal</code> ausgegeben werden.</li>
    </ul>
</script>
